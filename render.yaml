services:
  - type: web
    name: meetfree-core
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ALIYUN_API_KEY
        sync: false
      - key: ALIYUN_WORKSPACE_ID
        sync: false
      - key: ALIYUN_MODEL
        sync: false
      - key: ALIYUN_REGION
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
